name: Build and Release

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      module_name: ${{ steps.parse.outputs.module_name }}
      tag_version: ${{ steps.parse.outputs.tag_version }}
      sub_version: ${{ steps.parse.outputs.sub_version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse module name from tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag_version=$TAG" >> "$GITHUB_OUTPUT"
          MODULE_LIST=$(sed -n 's/.*\[submodule "\(.*\)"\]/\1/p' .gitmodules \
            | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-)
          MODULE=""
          for mod in $MODULE_LIST; do
            if [[ "$TAG" == "$mod-"* ]]; then
              MODULE="$mod"
              break
            fi
          done
          if [ -z "$MODULE" ]; then
            echo "Error: no submodule matches tag $TAG"
            exit 1
          fi
          echo "module_name=$MODULE" >> "$GITHUB_OUTPUT"

          VERSION="${TAG#${MODULE}-}"
          echo "sub_version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-snapshot ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nginx-branch: [mainline, stable]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build nginx module (Docker)
        run: |
          docker build \
            --build-arg NGINX_BRANCH=${{ matrix.nginx-branch }} \
            --build-arg MODULE_NAME="${{ needs.prepare.outputs.module_name }}" \
            -t nginx-module-builder \
            .

      - name: Extract .so files
        run: |
          mkdir -p dist
          docker create --name extract nginx-module-builder
          docker cp extract:/build/nginx-src/objs/. dist/
          docker rm extract

      - name: Get nginx version
        id: nginx
        run: |
          NGINX_VERSION=$(docker run --rm --entrypoint sh nginx-module-builder -c 'nginx -v 2>&1' | cut -d/ -f2)
          echo "version=$NGINX_VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename .so with nginx version
        run: |
          cd dist
          for f in *.so; do
            [ -f "$f" ] || continue
            stem="${f%.so}"
            mv "$f" "${stem}-nginx-${{ steps.nginx.outputs.version }}.so"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.module_name }}-so-${{ matrix.nginx-branch }}
          path: dist/

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare.outputs.module_name }}-so-*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.so > SHA256SUMS

      - name: Generate release body
        run: |
          MODULE="${{ needs.prepare.outputs.module_name }}"
          TAG="${{ needs.prepare.outputs.tag_version }}"
          VERSION="${{ needs.prepare.outputs.sub_version }}"
          SO_FILES=$(ls dist/*.so)
          {
            echo "## $MODULE v$VERSION"
            echo ""
            echo "| Nginx | File |"
            echo "|---|---|"
            for f in $SO_FILES; do
              BASENAME=$(basename "$f")
              NGX_VER=$(echo "$BASENAME" | sed 's/.*-nginx-\(.*\)\.so/\1/')
              echo "| $NGX_VER | [$BASENAME](https://github.com/${{ github.repository }}/releases/download/${TAG}/${BASENAME}) |"
            done
            echo ""
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > dist/release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_version }}
          name: ${{ needs.prepare.outputs.tag_version }}
          body_path: dist/release-body.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          files: |
            dist/*.so
            dist/SHA256SUMS
          generate_release_notes: false
          token: ${{ secrets.GH_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
